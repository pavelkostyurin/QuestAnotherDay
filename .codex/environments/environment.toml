version = 1
name = "Quest Another Day"

[setup]
script = ""

[[actions]]
name = "Verify release"
icon = "test"
command = "npm run verify"

[[actions]]
name = "Bump addon version"
icon = "tool"
command = "npm run version:bump"

[[actions]]
name = "Copy working copy to WoW"
icon = "tool"
command = "npm run install:addon"

[[actions]]
name = "Release"
icon = "tool"
command = "npm run release"

[[actions]]
name = "Rebuild faction quest data"
icon = "tool"
command = "npm run build:quest-data && npm run check:data"
