name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run JavaScript tests
        run: npm test

      - name: Run Python tests
        run: python3 -m unittest discover -s test -p 'test_*.py'

      - name: Verify quest coverage badge
        run: |
          python3 audit_quests.py data/classic-quests.json QuestData.lua \
            --badge-json /tmp/quest-coverage.json
          diff -u .github/badges/quest-coverage.json /tmp/quest-coverage.json
